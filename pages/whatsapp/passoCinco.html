<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/logoConectaPrincipal.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passo 5 - Conecta Gerações</title>
    <link rel="stylesheet" href="../../css/whatsapp/passoCinco.css" />
  </head>
  <body>
    <div class="card">
      <a href="./passoZero.html"
        ><button class="btn-close" aria-label="Fechar">✕</button>
      </a>

      <div class="card-body">
        <div class="left-column">
          <div class="logo-area">
            <div class="img-placeholder logo-placeholder">
              <img
                src="../../assets/img/logoConectaPrincipal.png"
                alt="Logo da nossa empresa"
                width="100px"
              />
            </div>
          </div>

          <div class="step-info">
            <h2 class="step-title">PASSO - 5</h2>
            <p class="step-description">
              Para mandar áudio toque no ícone de microfone, e fale o que você
              deseja.
            </p>
          </div>

          <div class="nav-buttons">
            <a href="./passoQuatro.html">
              <button class="btn-nav btn-prev" aria-label="Anterior">➔</button>
            </a>
            <a href="./passoSeis.html">
              <button class="btn-nav btn-next" aria-label="Próximo">➔</button>
            </a>
          </div>
        </div>

        <div class="right-column">
          <div class="phone-mockup">
            <div class="chat-header">
              <div class="header-left">
                <span class="back-arrow">←</span>
                <div class="avatar-placeholder">
                  <img
                    src="../../assets/img/Dona Joana.jpg"
                    alt="Velha amiga de infância (img usada para exemplo)"
                    width="35px"
                  />
                </div>
                <div class="contact-details">
                  <span class="contact-name">Maria</span>
                  <span class="contact-status">online</span>
                </div>
              </div>

              <div class="header-icons">
                <span class="icon">📹</span>
                <span class="icon">📞</span>
                <span class="icon">⋮</span>
              </div>
            </div>

            <div class="chat-body">
              <div class="date-badge">
                <span>Hoje</span>
              </div>
            </div>

            <div class="chat-footer">
              <div class="input-box">
                <span class="emoji-icon">😊</span>
                <span class="input-placeholder-text">Digite aqui...</span>
              </div>

              <div class="mic-highlight-wrapper">
                <button class="btn-mic" aria-label="Mandar áudio">🎙️</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  <script src="/js/accessibility.js" defer></script>
</body>
</html>
