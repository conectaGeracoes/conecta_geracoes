<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/Meu cantinho de Receitas(2).png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passo 9 - Conecta Gerações</title>
    <link rel="stylesheet" href="../../css/whatsapp/passoNove.css" />
  </head>
  <body>
    <div class="card">
      <a href="./passoZero.html">
        <button class="btn-close" aria-label="Fechar">✕</button>
      </a>

      <div class="card-body">
        <div class="left-column">
          <div class="logo-area">
            <div class="img-placeholder logo-placeholder">
              <img
                src="../../assets/img/Meu cantinho de Receitas(2).png"
                alt="Logo da nossa empresa"
                width="150px"
              />
            </div>
          </div>

          <div class="step-info">
            <h2 class="step-title">PASSO - 9</h2>
            <p class="step-description">
              O ícone de alto-falante muda o som do telefone para o viva voz.
            </p>
          </div>

          <div class="nav-buttons">
            <a href="./passoOito.html">
              <button class="btn-nav btn-prev" aria-label="Anterior">➔</button>
            </a>
            <a href="./passoDez.html">
              <button class="btn-nav btn-next" aria-label="Próximo">➔</button>
            </a>
          </div>
        </div>

        <div class="right-column">
          <div class="phone-mockup">
            <div class="call-header">
              <span class="icon-top left-icon">⤢</span>
              <div class="call-contact-info">
                <span class="contact-name">Maria</span>
                <span class="encryption-text"
                  >🔒 Protegida com a criptografia de ponta a ponta</span
                >
              </div>
              <div class="top-right-icons">
                <span class="icon-top">👤+</span>
                <span class="icon-top">💬</span>
              </div>
            </div>

            <div class="call-body">
              <div class="call-avatar-placeholder">
                <span class="avatar-icon">
                  <img
                    src="../../assets/img/Dona Joana.jpg"
                    alt="Velha amiga de infância(imagem usada para exemplo)"
                    width="100px"
                  />
                </span>
              </div>
            </div>

            <div class="call-footer">
              <button class="btn-call-action btn-more">•••</button>
              <button class="btn-call-action icon-placeholder">📹</button>

              <div class="speaker-highlight">
                <button class="btn-call-action icon-placeholder">🔊</button>
              </div>

              <button class="btn-call-action icon-placeholder">🎙️</button>

              <button class="btn-call-action btn-end-call">📞</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
