<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/logoConectaPrincipal.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passo 1 - WhatsApp</title>
    <link rel="stylesheet" href="../../css/whatsapp/passoUm.css" />
  </head>
  <body>
    <div class="card">
      <a href="./passoZero.html">
        <button class="btn-close" aria-label="Fechar">✕</button>
      </a>

      <div class="card-content">
        <div class="left-column">
          <h2 class="step-title">PASSO - 1</h2>
          <p class="step-description">
            Clique no ícone do WhatsApp para abrir o aplicativo
          </p>

          <div class="hint-box">
            <div class="hint-icon">
              <img
                src="../../assets/img/tips.png"
                alt="Icone de uma lâmpada"
                width="30px"
              />
            </div>
            <p class="hint-text">
              <strong>Dica:</strong> O ícone do aplicativo WhatsApp é verde com
              um telefone dentro de um balão.
            </p>
          </div>

          <div class="nav-buttons">
            <a href="./passoZero.html">
              <button class="btn-nav btn-prev" aria-label="Anterior">➔</button>
            </a>
            <a href="./passoDois.html">
              <button class="btn-nav btn-next" aria-label="Próximo">➔</button>
            </a>
          </div>
        </div>

        <div class="middle-column">
          <div class="img-placeholder arrow-placeholder">
            <img
              src="../../assets/img/atention.png"
              alt="Uma seta dizendo onde deve-se prestar atenção"
              width="120px"
            />
          </div>
        </div>

        <div class="right-column">
          <div class="img-placeholder phone-placeholder">
            <img
              src="../../assets/img/cellphone.png"
              alt="Um celular para dar exemplo"
              width="250px"
            />
          </div>
        </div>
      </div>
    </div>
  <script src="/js/accessibility.js" defer></script>

</html>
