<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/base/global.css">
    <link rel="stylesheet" href="../../css/golpeEntrega/passos.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/logoConectaPrincipal.png"/>
    
    <title>Passo a Passo - Falsa Entrega</title>
  </head>
  <body>
    <a href="./inicioPromocoes.html" class="fechar"
      ><img
        width="48"
        height="48"
        src="https://img.icons8.com/fluency-systems-filled/48/multiply.png"
        alt="multiply"
    /></a>
    <main class="cartao">

      <div class="conteudo">
        <section class="texto">
          <img src="../../assets/img/logo.png" class="logo" alt="Logo" />
          <h2>PASSO - 2</h2>
          <p class="descricao">
            Se o entregador pedir pagamento na hora, desconfie. Compras legítimas já têm o frete pago. Nunca passe o cartão sem conferir.
          </p>
          <div class="dica">
            <div class="icone-dica">
              <img width="45" height="45" src="https://img.icons8.com/dusk/45/light-on.png" alt="light-on"/>
            </div>
            <div class="texto-dica">
              <h3>Ação:</h3>
              <p>Recuse terminantemente pagar qualquer valor na porta com cartão. Se a loja exige taxa, que seja cobrada pelo aplicativo ou site oficial.</p>
            </div>
          </div>
          <div class="navegacao">
            <a href="./passoUm.html">
              <img
                width="45"
                height="45"
                src="https://img.icons8.com/ios-filled/45/ffffff/long-arrow-left.png"
                alt="long-arrow-left"
              />
            </a>
            <a href="./passoTres.html">
              <img
                width="45"
                height="45"
                src="https://img.icons8.com/ios-filled/45/ffffff/long-arrow-right.png"
                alt="long-arrow-right"
              />
            </a>
          </div>
        </section>
        <section class="imagem-area">
          <div class="seta"></div>
          <div class="celular">
            <img src="../../assets/img/img-seguranca/promocoesFalsas2.png" alt="dona maria brava" />
          </div>
        </section>
      </div>
    </main>
  <script src="/js/accessibility.js" defer></script>
</body>
</html>
