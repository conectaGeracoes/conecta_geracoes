<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/base/global.css">
    <link rel="stylesheet" href="/css/golpeEntrega/passos.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/logoConectaPrincipal.png"/>
    
    <title>Passo a Passo - Falsa Entrega</title>
  </head>
  <body>
    <a href="./inicioPromocoes.html" class="fechar"
      ><img
        width="48"
        height="48"
        src="https://img.icons8.com/fluency-systems-filled/48/multiply.png"
        alt="multiply"
    /></a>
    <main class="cartao">

      <div class="conteudo">
        <section class="texto">
          <img src="../../assets/img/logo.png" class="logo" alt="Logo" />
          <h2>PASSO - 3</h2>
          <p class="descricao">
            Se o entregador insistir ou pressionar você, não aceite a entrega. Feche a porta e confirme a compra com um familiar ou pelo aplicativo oficial.
          </p>
          <div class="dica">
            <div class="icone-dica">
              <img width="45" height="45" src="https://img.icons8.com/dusk/45/light-on.png" alt="light-on"/>
            </div>
            <div class="texto-dica">
              <h3>Ação:</h3>
              <p>Feche a porta e, se necessário, use o celular para ligar para um parente e confirmar.</p>
            </div>
          </div>
          <div class="navegacao">
            <a href="./passoDois.html">
              <img
                width="45"
                height="45"
                src="https://img.icons8.com/ios-filled/45/ffffff/long-arrow-left.png"
                alt="long-arrow-left"
              />
            </a>
            <a href="../inss/conclusão.html">
              <img
                width="45"
                height="45"
                src="https://img.icons8.com/ios-filled/45/ffffff/long-arrow-right.png"
                alt="long-arrow-right"
              />
            </a>
          </div>
        </section>
        <section class="imagem-area">
          <div class="seta"></div>
          <div class="celular">
            <img src="../../assets/img/img-seguranca/promocoesFalsas3.png" alt="dona maria brava" />
          </div>
        </section>
      </div>
    </main>
  <script src="/js/accessibility.js" defer></script>
</body>
</html>
