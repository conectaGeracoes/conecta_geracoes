<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../assets/img/Meu cantinho de Receitas(2).png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passo 4 - Conecta Gerações</title>
    <link rel="stylesheet" href="../css/passoQuatro.css" />
  </head>
  <body>
    <div class="card">
      <a href="./passoZero.html">
        <button class="btn-close" aria-label="Fechar">✕</button>
      </a>
      <div class="card-body">
        <div class="left-column">
          <div class="logo-area">
            <div class="img-placeholder logo-placeholder">
              <img
                src="../assets/img/Meu cantinho de Receitas(2).png"
                alt="Logo da nossa empresa"
                width="100px"
              />
            </div>
          </div>

          <div class="step-info">
            <h2 class="step-title">PASSO - 4</h2>
            <p class="step-description">
              Toque em cima da seta branca para encaminhar sua mensagem.
            </p>
          </div>

          <div class="nav-buttons">
            <a href="./passoTrês.html">
              <button class="btn-nav btn-prev" aria-label="Anterior">➔</button>
            </a>
            <a href="./voceAindaNaoConhece.html">
              <button class="btn-nav btn-next" aria-label="Próximo">➔</button>
            </a>
          </div>
        </div>

        <div class="right-column">
          <div class="phone-mockup">
            <div class="chat-header">
              <div class="header-left">
                <span class="back-arrow">←</span>
                <div class="avatar-placeholder">
                  <img
                    src="../assets/img/Dona Joana.jpg"
                    alt="Uma velha amiga de infância (img usada para exemplo)"
                    width="35px"
                  />
                </div>
                <div class="contact-details">
                  <span class="contact-name">Maria</span>
                  <span class="contact-status">online</span>
                </div>
              </div>

              <div class="header-icons">
                <span class="icon">📹</span>
                <span class="icon">📞</span>
                <span class="icon">⋮</span>
              </div>
            </div>

            <div class="chat-body">
              <div class="date-badge">
                <span>Hoje</span>
              </div>
            </div>

            <div class="chat-footer">
              <div class="input-box">
                <span class="emoji-icon">😊</span>
                <span class="input-text">Bom dia, Maria!</span>
              </div>

              <div class="send-highlight-wrapper">
                <a href="./passoCinco.html">
                  <button class="btn-send" aria-label="Enviar">➔</button>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
