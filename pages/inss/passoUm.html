<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/inss/passoUm.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <title>Passo a Passo - Meu INSS</title>
  </head>
  <body>
    <a href="./inicio.html" class="fechar"
      ><img
        width="48"
        height="48"
        src="https://img.icons8.com/fluency-systems-filled/48/multiply.png"
        alt="multiply"
    /></a>
    <main class="cartao">

      <div class="conteudo">
        <section class="texto">
          <img src="../../assets/img/logo.png" class="logo" alt="Logo" />
          <h2>PASSO - 1</h2>
          <p class="descricao">
            Encontre o ícone do Meu INSS para abrir o aplicativo.
          </p>
          <div class="dica">
            <div class="icone-dica">
              <img width="45" height="45" src="https://img.icons8.com/dusk/45/light-on.png" alt="light-on"/>
            </div>
            <div class="texto-dica">
              <h3>Dica:</h3>
              <p>Nunca compartilhe sua senha com outras pessoas.</p>
            </div>
          </div>
          <div class="navegacao">
            <a href="./inicio.html">
              <img
                width="45"
                height="45"
                src="https://img.icons8.com/ios-filled/45/ffffff/long-arrow-left.png"
                alt="long-arrow-left"
              />
            </a>
            <a href="./passoDois.html">
              <img
                width="45"
                height="45"
                src="https://img.icons8.com/ios-filled/45/ffffff/long-arrow-right.png"
                alt="long-arrow-right"
              />
            </a>
          </div>
        </section>
        <section class="imagem-area">
          <div class="seta"></div>
          <div class="celular">
            <img src="../../assets/img/celular (2).png" alt="Tela do celular" />
          </div>
        </section>
      </div>
    </main>

</html>
