<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/inss/inicio.css" />
    <link rel="stylesheet" href="../../components/header.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <title>Conecta Gerações</title>
  </head>
  <body>
   <div id="header"></div>
    <main class="secao-principal">
      <section class="conteudo">
        <h1>Serviços<br />Público</h1>
        <div class="linha"></div>
        <p>Acesse GOV, INSS e outros serviços de forma simples e segura.</p>
        <div class="vantagens">
          <div class="vantagem">
            <div class="icone">
              <img
                src="../../assets/img/user-circle.png"
                alt="Acesso facilitado"
              />
            </div>
            <span>Acesso facilitado e serviços</span>
          </div>

          <div class="vantagem">
            <div class="icone">
              <img src="../../assets/img/seguranca.png" alt="Segurança" />
            </div>
            <span>Informações oficiais e seguras</span>
          </div>

          <div class="vantagem">
            <div class="icone">
              <img src="../../assets/img/check.png" alt="Passo a passo" />
            </div>
            <span>Orientações passo a passo</span>
          </div>
        </div>

        <a href="./passoUm.html" class="botao">
          <div class="play">
            <img src="../../assets/img/play.png" alt="Play" />
          </div>
          <span>Começar o passo a passo</span>
        </a>
      </section>
      <section class="area-imagem">
        <div class="cartao gov">
          <img src="../../assets/img/govbr 1.png" alt="GOV.BR" />
        </div>
        <div class="cartao inss">
          <img src="../../assets/img/inss-logo.png" alt="INSS" />
        </div>
        <div class="imagem-principal">
          <img src="../../assets/img/bank.png" alt="Serviços Públicos" />
        </div>
      </section>
    </main>
    <script src="../../js/loadComponents.js"></script>
  </body>
</html>
