<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passo 2 - Conecta Gerações</title>
    <link rel="stylesheet" href="../css/passoDois.css" />
  </head>
  <body>
    <div class="card">
      <button class="btn-close" aria-label="Fechar">✕</button>

      <div class="card-body">
        <div class="left-column">
          <div class="logo-area">
            <div class="img-placeholder logo-placeholder">
              <img
                src="../assets/img/Meu cantinho de Receitas(2).png"
                alt="Imagem da nossa logo"
                width="100px"
              />
            </div>
          </div>

          <div class="step-info">
            <h2 class="step-title">PASSO - 2</h2>
            <p class="step-description">
              Toque em cima do contato que você deseja mandar mensagem.
            </p>
          </div>

          <div class="nav-buttons">
            <a href="../pages/passoUm.html"
              ><button class="btn-nav btn-prev" aria-label="Anterior">
                ➔
              </button></a
            >
            <a href="../pages/passoTrês.html"
              ><button class="btn-nav btn-next" aria-label="Próximo">
                ➔
              </button></a
            >
          </div>
        </div>

        <div class="middle-column">
          <div class="img-placeholder arrow-placeholder">
            <img
              src="../assets/img/atention.png"
              alt="Seta mostrando o local de exemplo"
              width="100px"
            />
          </div>
        </div>

        <div class="right-column">
          <div class="phone-mockup">
            <div class="whatsapp-header">
              <div class="header-top">
                <span class="app-title">WhatsApp</span>
                <div class="header-icons">
                  <span class="icon">🔍</span>
                  <span class="icon">⋮</span>
                </div>
              </div>
              <div class="header-tabs">
                <span class="tab"></span>
                <span class="tab active">Conversas</span>
                <span class="tab">Status</span>
                <span class="tab">Chamadas</span>
              </div>
            </div>

            <div class="chat-list">
              <div class="chat-item selected">
                <div class="avatar-placeholder">
                  <img
                    src="../assets/img/Dona Joana.jpg"
                    alt="Amiga de infancia(Imagem usada como exemplo)"
                    width="43px"
                  />
                </div>
                <div class="chat-info">
                  <div class="chat-header">
                    <span class="contact-name">Dona Joana</span>
                    <span class="chat-time highlight">09:30</span>
                  </div>
                  <p class="last-message">Oi! Tudo bem?</p>
                </div>
              </div>

              <div class="chat-item">
                <div class="avatar-placeholder">
                  <img
                    src="../assets/img/Obreiro João.jpg"
                    alt="Obreiro da igreja(Imagem usada como exemplo)"
                    width="43px"
                  />
                </div>
                <div class="chat-info">
                  <div class="chat-header">
                    <span class="contact-name">Obreiro João</span>
                    <span class="chat-time">Ontem</span>
                  </div>
                  <p class="last-message">Bom dia!</p>
                </div>
              </div>

              <div class="chat-item">
                <div class="avatar-placeholder">
                  <img
                    src="../assets/img/Grp Família.jpg"
                    alt="Grupo da família(Imagem usada como exemplo)"
                    width="43px"
                  />
                </div>
                <div class="chat-info">
                  <div class="chat-header">
                    <span class="contact-name">Grupo da Família</span>
                    <span class="chat-time">Ontem</span>
                  </div>
                  <p class="last-message">📷 Foto</p>
                </div>
              </div>

              <div class="chat-item">
                <div class="avatar-placeholder">
                  <img
                    src="../assets/img/Quiroprata.png"
                    alt="Nome do Quiroprata Roberto(Imagem usada como exemplo)"
                    width="43px"
                  />
                </div>
                <div class="chat-info">
                  <div class="chat-header">
                    <span class="contact-name">Quiroprata Roberto </span>
                    <span class="chat-time">Ontem</span>
                  </div>
                  <p class="last-message">Obrigada!</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
